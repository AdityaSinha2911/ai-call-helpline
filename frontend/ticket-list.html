<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket List — AI Helpline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <h1>AI Helpline</h1>
    <p>Admin Dashboard</p>
  </div>
  <nav class="sidebar-nav">
    <span class="nav-label">Menu</span>
    <a href="index.html" class="nav-item" data-page="index.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Call Details
    </a>
    <a href="tickets.html" class="nav-item" data-page="tickets.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 5v2M15 11v2M15 17v2M5 5h14a2 2 0 012 2v3a2 2 0 000 4v3a2 2 0 01-2 2H5a2 2 0 01-2-2v-3a2 2 0 000-4V7a2 2 0 012-2z"/></svg>
      Ticket Categories
    </a>
    <a href="ticket-list.html" class="nav-item active" data-page="ticket-list.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Ticket List
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="avatar">A</div>
    <div class="avatar-info">
      <p>Admin</p>
      <span>College Helpline</span>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="page-header">
    <div>
      <h2>Ticket List</h2>
      <p>Search and manage all student tickets</p>
    </div>
  </div>

  <!-- FILTERS -->
  <div style="display:flex;gap:10px;margin-bottom:16px;align-items:center">
    <div class="date-tabs">
      <button class="date-tab active" data-filter="all">All</button>
      <button class="date-tab" data-filter="Open">Open</button>
      <button class="date-tab" data-filter="In Progress">In Progress</button>
      <button class="date-tab" data-filter="Closed">Closed</button>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <span style="font-size:12px;color:var(--text-muted)">Ret. ID</span>
      <div class="search-bar" style="margin-bottom:0;width:200px;padding:7px 12px">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:var(--text-muted);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search Reg. ID...">
      </div>
    </div>
  </div>

  <!-- TWO COLUMN LAYOUT -->
  <div class="ticket-layout">

    <!-- LEFT: TICKET LIST -->
    <div id="ticketListContainer">
      <div class="loading">Loading tickets...</div>
    </div>

    <!-- RIGHT: DETAIL PANEL -->
    <div class="detail-card" id="detailPanel">
      <div class="empty-state">
        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" style="color:var(--text-muted);margin:0 auto 8px;display:block"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <p>Select a ticket to view details</p>
      </div>
    </div>

  </div>
</main>

<script src="app.js"></script>
<script>
let allTickets = [];
let activeFilter = 'all';
let selectedId = null;

// Read URL param for category filter (from tickets.html links)
const urlParams = new URLSearchParams(window.location.search);
const categoryFilter = urlParams.get('category');

async function loadTickets() {
  allTickets = await fetchTickets();
  renderList();
}

function renderList() {
  const search = document.getElementById('searchInput').value.toLowerCase();

  let filtered = allTickets.filter(t => {
    const matchStatus   = activeFilter === 'all' || t.status === activeFilter;
    const matchSearch   = !search || (t.student_id || '').toLowerCase().includes(search);
    const matchCategory = !categoryFilter || t.category === categoryFilter;
    return matchStatus && matchSearch && matchCategory;
  });

  const container = document.getElementById('ticketListContainer');

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><p>No tickets found</p></div>`;
    return;
  }

  container.innerHTML = filtered.map(t => `
    <div class="ticket-item ${selectedId === t.id ? 'active' : ''}"
         onclick="selectTicket(${t.id})">
      <div class="ticket-item-left">
        <h4>Ret. ${t.student_id || '—'} &nbsp; ${categoryEmoji(t.category)} ${t.category || ''}</h4>
        <p>${truncate(t.issue, 70)}</p>
        <div class="ticket-item-meta">#${t.id} &nbsp;·&nbsp; ${timeAgo(t.created_at)}</div>
      </div>
      <div style="flex-shrink:0;margin-left:10px">${statusBadge(t.status)}</div>
    </div>
  `).join('');
}

function selectTicket(id) {
  selectedId = id;
  const t = allTickets.find(x => x.id === id);
  if (!t) return;

  renderList(); // re-render to highlight active

  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <h3>Ticket Summary Details</h3>
    <div class="detail-id">Ret. ${t.student_id || '—'} &nbsp;·&nbsp; Ticket #${t.id}</div>

    <div class="detail-field">
      <label>Title</label>
      <p>${categoryEmoji(t.category)} ${t.category ? t.category.charAt(0).toUpperCase() + t.category.slice(1) : ''} Issue</p>
    </div>

    <div class="detail-field">
      <label>Description</label>
      <p>${t.issue || '—'}</p>
    </div>

    <div class="detail-field">
      <label>Status</label>
      <p>${statusBadge(t.status)}</p>
    </div>

    <div class="detail-field">
      <label>Assigned To</label>
      <p>${t.assigned_to || '—'}</p>
    </div>

    <div class="detail-field">
      <label>Priority</label>
      <p>${t.priority || 'Normal'}</p>
    </div>

    <div class="detail-divider"></div>

    <div class="detail-field">
      <label>Last Note</label>
      <p style="color:var(--text-secondary);font-size:12px">
        ${formatDate(t.created_at)} at ${formatTime(t.created_at)}<br>
        ${t.admin_note || 'No admin note yet.'}
      </p>
    </div>

    ${t.status !== 'Closed' ? `
      <div class="detail-divider"></div>
      <textarea id="adminNoteInput" placeholder="Add a note before closing..."
        style="width:100%;font-family:var(--font);font-size:13px;padding:9px 12px;
               border:1px solid var(--border);border-radius:var(--radius-sm);
               resize:vertical;min-height:70px;outline:none;margin-bottom:10px;
               color:var(--text-primary)"></textarea>
      <button class="btn btn-danger btn-full" onclick="handleClose(${t.id})">
        Mark as Closed
      </button>
    ` : `
      <div style="text-align:center;padding:10px;font-size:13px;color:var(--success);font-weight:500">
        ✓ Ticket Resolved
      </div>
    `}
  `;
}

async function handleClose(ticketId) {
  const note = document.getElementById('adminNoteInput')?.value || '';
  const btn = event.target;
  btn.textContent = 'Closing...';
  btn.disabled = true;

  const result = await closeTicket(ticketId, note);
  if (result.status === 'success' || result.message) {
    await loadTickets();
    selectTicket(ticketId);
  } else {
    btn.textContent = 'Mark as Closed';
    btn.disabled = false;
    alert('Failed to close ticket. Please try again.');
  }
}

// Filter tabs
document.querySelectorAll('.date-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.date-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderList();
  });
});

// Search
document.getElementById('searchInput').addEventListener('input', renderList);

loadTickets();
</script>

</body>
</html>
