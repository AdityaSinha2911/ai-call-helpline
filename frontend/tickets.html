<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Categories — AI Helpline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <h1>AI Helpline</h1>
    <p>Admin Dashboard</p>
  </div>
  <nav class="sidebar-nav">
    <span class="nav-label">Menu</span>
    <a href="index.html" class="nav-item" data-page="index.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Call Details
    </a>
    <a href="tickets.html" class="nav-item active" data-page="tickets.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 5v2M15 11v2M15 17v2M5 5h14a2 2 0 012 2v3a2 2 0 000 4v3a2 2 0 01-2 2H5a2 2 0 01-2-2v-3a2 2 0 000-4V7a2 2 0 012-2z"/></svg>
      Ticket Categories
    </a>
    <a href="ticket-list.html" class="nav-item" data-page="ticket-list.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Ticket List
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="avatar">A</div>
    <div class="avatar-info">
      <p>Admin</p>
      <span>College Helpline</span>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="page-header">
    <div>
      <h2>Ticket Categories</h2>
      <p>Active tickets grouped by department</p>
    </div>
    <a href="ticket-list.html" class="btn btn-primary" style="text-decoration:none">
      View All Tickets →
    </a>
  </div>

  <!-- SUMMARY ROW -->
  <div style="display:flex;gap:12px;margin-bottom:24px">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 20px;flex:1;text-align:center">
      <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Total Tickets</div>
      <div style="font-size:28px;font-weight:600;color:var(--text-primary)" id="total-count">—</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 20px;flex:1;text-align:center">
      <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Open</div>
      <div style="font-size:28px;font-weight:600;color:var(--primary)" id="open-count">—</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 20px;flex:1;text-align:center">
      <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">In Progress</div>
      <div style="font-size:28px;font-weight:600;color:var(--warning)" id="progress-count">—</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 20px;flex:1;text-align:center">
      <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Closed</div>
      <div style="font-size:28px;font-weight:600;color:var(--success)" id="closed-count">—</div>
    </div>
  </div>

  <!-- CATEGORY CARDS -->
  <div class="category-grid" id="categoryGrid">
    <div class="loading" style="grid-column:span 2">Loading categories...</div>
  </div>
</main>

<script src="app.js"></script>
<script>
const CATEGORIES = [
  { key: 'fees',       label: 'Fees Related',     icon: '💰', cls: 'fees',    dept: 'Accounts Department' },
  { key: 'technical',  label: 'Technical Problem', icon: '🔧', cls: 'tech',    dept: 'IT Support' },
  { key: 'document',   label: 'Document Problem',  icon: '📄', cls: 'doc',     dept: 'Admin Office' },
  { key: 'exam',       label: 'Exam Related',      icon: '📝', cls: 'exam',    dept: 'Examination Cell' },
  { key: 'hostel',     label: 'Hostel Problem',    icon: '🏠', cls: 'hostel',  dept: 'Hostel Administration' },
  { key: 'other',      label: 'Others',            icon: '❓', cls: 'other',   dept: 'Student Affairs' },
];

async function loadPage() {
  const stats = await fetchTicketStats();
  const by_cat = stats.by_category || {};

  document.getElementById('total-count').textContent    = stats.total       ?? 0;
  document.getElementById('open-count').textContent     = stats.open        ?? 0;
  document.getElementById('progress-count').textContent = stats.in_progress ?? 0;
  document.getElementById('closed-count').textContent   = stats.closed      ?? 0;

  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = CATEGORIES.map(cat => {
    const count = by_cat[cat.key] || 0;
    return `
      <a href="ticket-list.html?category=${cat.key}" class="category-card">
        <div class="cat-icon ${cat.cls}">${cat.icon}</div>
        <div class="cat-info">
          <h3>${cat.label}</h3>
          <p>${cat.dept}</p>
          <div class="count">${count}</div>
          <p style="font-size:11px;color:var(--text-muted);margin-top:2px">active ticket${count !== 1 ? 's' : ''}</p>
        </div>
      </a>
    `;
  }).join('');
}

loadPage();
</script>

</body>
</html>
